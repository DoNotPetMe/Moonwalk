; ============================================================================
;  Moonwalk Pro - configuration  (native Windows app, no AutoHotkey)
; ----------------------------------------------------------------------------
;  Sequence tokens (Intro / Sustain):
;     F=forward  B=backward  L=left  R=right  S=sprint
;     One step  = DIR:MS   (ms to hold)        e.g.  L:200
;     Diagonals = combine letters              e.g.  FL:120  (fwd+left)
;     Chain steps with commas                  e.g.  L:200,B:300,L:200,F:300
;  Intro   = played once.
;  Sustain = looped while held (Hold) or until re-pressed (Toggle).
; ============================================================================

[General]
; Hold the sprint key for the whole trick? 1/0
Sprinting=1
; Only act while the game window is focused? 1/0
OnlyWhenGameActive=0
GameProcess=DeadByDaylight-Win64-Shipping.exe
; Small on-screen status overlay: 1/0
ShowStatusGui=1
; Force a mode on every (non-Tap) trick: blank=per-trick | Hold | Toggle.
; Also switchable live from the tray menu.
DefaultMode=

; --- Human-plausible timing (keeps inputs from looking robotic) ---
Humanize=1
JitterPercent=15
; No step is ever held shorter than this (ms) - avoids impossible taps.
MinStepMs=30
; Max random gap inserted between steps (ms). 0 = none.
MaxGapMs=10

MasterToggleKey=F8
PanicStopKey=F10
DetectControllerKey=F9

[Movement]
Forward=w
Backward=s
Left=a
Right=d
Sprint=Shift

[Controller]
Enabled=1
; Player slot 1-4 (XInput). Most setups = 1.
PlayerIndex=1
; Poll interval in ms.
PollRate=10

; Button names: A B X Y LB RB LT RT LS RS Back Start DUp DDown DLeft DRight
; (comma-separate to bind several). Press the Detect key to discover names.
; The four moonwalk styles default to the D-pad - swap the JoyButton= lines
; between sections to rearrange them however you like.

[Tricks]
List=ClassicMoonwalk,MJGlide,DiagonalLeft,DiagonalRight,CircleStrafe,QuickJuke

; --- D-pad Down: the killer red-stain moonwalk -------------------------------
; Plain backwards walk. You keep the camera (right stick / mouse) pointed
; wherever you want survivors to THINK you're going; your red stain points
; there while you actually back around the loop.
[ClassicMoonwalk]
Mode=Hold
Key=Numpad2
JoyButton=DDown
Intro=B:250
Sustain=B:600

; --- D-pad Up: the stutter / "MJ" glide --------------------------------------
; The classic community moonwalk pattern: a direction-scrambling intro, then
; rapid alternating strafes for the glide look. Timings are the field-tested
; community-script values.
[MJGlide]
Mode=Hold
Key=Numpad8
JoyButton=DUp
Intro=L:200,B:300,L:200,F:300
Sustain=L:60,R:60

; --- D-pad Left / Right: diagonal moonwalks ----------------------------------
; Back-diagonal walk: hides the stain while still drifting toward one side of
; a loop. Mirror pair, so bind whichever side you juke toward more.
[DiagonalLeft]
Mode=Hold
Key=Numpad4
JoyButton=DLeft
Intro=B:150
Sustain=BL:500

[DiagonalRight]
Mode=Hold
Key=Numpad6
JoyButton=DRight
Intro=B:150
Sustain=BR:500

; --- Extras (keyboard-only by default; give them a JoyButton to pad-bind) ----
; Circle-strafe juke. WASD only strafes relative to the camera - a true
; camera 360 needs the mouse. This walks a quick circle to bait a swing.
[CircleStrafe]
Mode=Tap
Key=Numpad1
JoyButton=
Intro=L:90,FL:90,F:90,FR:90,R:90,BR:90,B:90,BL:90
Sustain=

[QuickJuke]
Mode=Tap
Key=Numpad0
JoyButton=
Intro=L:120,R:120
Sustain=
