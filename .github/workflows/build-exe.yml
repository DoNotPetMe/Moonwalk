name: Build Moonwalk Pro (.exe)

# Publishes a single, self-contained Windows .exe (no .NET install needed by you).
#
# How to get your app:
#   1. Open the "Actions" tab on GitHub.
#   2. Click the latest "Build Moonwalk Pro (.exe)" run.
#   3. Download the "MoonwalkPro" artifact (a zip) at the bottom.
#   4. Unzip and double-click MoonwalkPro.exe. It lives in the tray.

on:
  push:
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "config.ini"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish single-file self-contained exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet publish MoonwalkPro.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish
          if (-not (Test-Path "publish/MoonwalkPro.exe")) { throw "Publish produced no exe" }
          $f = Get-Item "publish/MoonwalkPro.exe"
          Write-Host "Built MoonwalkPro.exe ($([math]::Round($f.Length/1MB,1)) MB)"

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item publish/MoonwalkPro.exe dist/
          Copy-Item config.ini dist/ -ErrorAction SilentlyContinue
          Copy-Item README.md  dist/ -ErrorAction SilentlyContinue

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonwalkPro
          path: dist/
